openapi: 3.0.3
info:
  title: Craft API
  version: 1.0.0
  description: API for the Craft application
servers:
  - url: /api
    description: API base path
paths:
  /templates:
    get:
      summary: List templates
      description: Returns all templates as a plain array. Pagination parameters are not supported.
      operationId: listTemplates
      tags:
        - Templates
      responses:
        '200':
          description: A list of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Template:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
